name: causalrank
channels:
  - pytorch
  - nvidia
  - defaults
dependencies:
  - python=3.11
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  # PyTorch's Conda binary requires the ITT symbols removed from MKL 2024.1+.
  - mkl=2023.1
  - intel-openmp=2023.1
  - tbb=2021.8
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.2.3
      - pytest==8.3.4
